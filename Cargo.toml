[package]
name = "php-migrator"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "CLI en Rust para analizar, mapear lógica y migrar proyectos PHP (7.4-8.x a 8.5) por módulos con verificación Docker y soporte IA BYOK."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
rayon = "1.10"
ignore = "0.4"
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
anyhow = "1.0"
thiserror = "1.0"
regex = "1.11"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"
